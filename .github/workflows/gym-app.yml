name: Gym app

on:
  push:
    branches: [main]
    paths:
      - 'gymApp/**'
      - '.github/workflows/gym-app.yml'
  pull_request:
    paths:
      - 'gymApp/**'
      - '.github/workflows/gym-app.yml'

defaults:
  run:
    working-directory: gymApp

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gymApp/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci
